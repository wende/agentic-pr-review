name: Agentic PR Review
description: OpenHands-based pull request review with full-repository tools and follow-up awareness
author: wende

branding:
  icon: search
  color: purple

inputs:
  llm-model:
    description: LiteLLM model identifier
    required: false
    default: openai/MiniMax-M3
  llm-base-url:
    description: OpenAI-compatible model API base URL
    required: false
    default: https://api.minimax.io/v1
  llm-api-key:
    description: Model API key
    required: true
  github-token:
    description: GitHub token used for PR reviews and repository memory; pass github.token in Actions
    required: true
  use-sub-agents:
    description: Allow the reviewer to delegate large diffs to file-level agents
    required: false
    default: 'true'
  review-wrap-up-iterations:
    description: Coordinator iteration after which investigation stops and review publication begins
    required: false
    default: '40'
  max-review-iterations:
    description: Hard model/tool iteration cutoff for the coordinator and each delegated agent
    required: false
    default: '60'
  review-wrap-up-seconds:
    description: Coordinator working seconds after which investigation stops and review publication begins
    required: false
    default: '1200'
  subagent-wrap-up-iterations:
    description: Delegated-agent iteration after which investigation stops and findings are returned
    required: false
    default: '25'
  subagent-wrap-up-seconds:
    description: Delegated-agent working seconds after which investigation stops and findings are returned
    required: false
    default: '600'
  load-public-skills:
    description: Load the OpenHands public skill catalog
    required: false
    default: 'true'
  require-evidence:
    description: Require end-to-end evidence in the PR description
    required: false
    default: 'false'
  review-guidance-path:
    description: Optional plain Markdown best-practices file in the consumer repository
    required: false
    default: ''
  memory-enabled:
    description: Load and update persistent repository review memory through a GitHub issue
    required: false
    default: 'true'
  memory-issue-number:
    description: Existing memory issue number; when empty, discover or create the repository memory issue
    required: false
    default: ''
  max-changed-lines:
    description: >
      Skip the review when additions plus deletions exceed this count, and
      comment on the pull request instead. Set to 0 to review any size.
    required: false
    default: '10000'
  skip-label:
    description: Pull request label that skips the review; empty disables the check
    required: false
    default: skip-review
  extensions-version:
    description: Pinned OpenHands extensions commit
    required: false
    default: 9def413cc05fa8287ed236d846af85f977baea45
  openhands-sdk-package:
    description: Pinned OpenHands SDK package specification
    required: false
    default: openhands-sdk==1.39.0
  openhands-tools-package:
    description: Pinned OpenHands tools package specification
    required: false
    default: openhands-tools==1.39.0
  lmnr-package:
    description: >
      Pinned Laminar client package specification. Required only because the
      pinned agent script imports lmnr unconditionally; this action sends no
      telemetry to Laminar.
    required: false
    default: lmnr==0.7.57
  enable-uv-cache:
    description: Enable the shared GitHub Actions uv cache
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Label check is free (event payload) and runs first so a labelled PR
    # never pays for the size API call. Every later step is also gated on
    # steps.skip; see the contract test that enforces that.
    - name: Evaluate skip label
      id: skip
      shell: bash
      env:
        SKIP: ${{ inputs.skip-label != '' && contains(github.event.pull_request.labels.*.name, inputs.skip-label) }}
        SKIP_LABEL: ${{ inputs.skip-label }}
      run: |
        echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
        if [[ "$SKIP" == "true" ]]; then
          echo "::notice::Skipping the review because the pull request carries the '${SKIP_LABEL}' label"
        fi

    # Runs before the checkouts so an oversized pull request costs one API
    # call rather than a full clone and a model run. Every later step is
    # gated on the result; see the contract test that enforces that.
    - name: Check pull request size
      if: steps.skip.outputs.skip != 'true'
      id: size
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MAX_CHANGED_LINES: ${{ inputs.max-changed-lines }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [[ -z "$PR_NUMBER" ]]; then
          echo "::notice::No pull request number; leaving the size gate open so configuration validation reports it"
          exit 0
        fi
        if ! pr_size="$(
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '"\(.additions) \(.deletions)"'
        )"; then
          echo "::error::Could not read pull request size from the GitHub API"
          exit 1
        fi
        read -r additions deletions <<<"$pr_size"
        "$GITHUB_ACTION_PATH/scripts/check-pr-size.sh" \
          "$additions" "$deletions" "$MAX_CHANGED_LINES"

    - name: Report an oversized pull request
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CHANGED_LINES: ${{ steps.size.outputs.changed-lines }}
        MAX_CHANGED_LINES: ${{ inputs.max-changed-lines }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        marker='<!-- agentic-pr-review-size -->'
        body="$(
          printf '%s\n\n' "$marker"
          printf 'Skipped automatic review: this pull request changes %s lines, above the %s line limit.\n\n' \
            "$CHANGED_LINES" "$MAX_CHANGED_LINES"
          printf 'Reviews of this size are unreliable and expensive. Split the pull request, or raise `max-changed-lines` in the review workflow to review it anyway.\n'
        )"
        comment_id="$(
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
            jq --arg marker "$marker" '
              (if length > 0 and (.[0] | type) == "array" then add else . end)
              | map(select((.body // "") | startswith($marker)))
              | map(.id)
              | max // empty
            '
        )"
        # Edit the existing notice instead of posting one per push while the
        # PR stays oversized. When it drops under the limit, the clear step
        # deletes the notice so a real review is not paired with a skip post.
        if [[ -n "$comment_id" ]]; then
          gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" \
            -f body="$body" --jq '.id'
        else
          gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$body" --jq '.id'
        fi

    - name: Clear size skip notice
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [[ -z "$PR_NUMBER" ]]; then
          exit 0
        fi
        marker='<!-- agentic-pr-review-size -->'
        comment_ids="$(
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
            jq --arg marker "$marker" -r '
              (if length > 0 and (.[0] | type) == "array" then add else . end)
              | map(select((.body // "") | startswith($marker)))
              | map(.id)
              | .[]
            '
        )"
        # No-op when none match. Delete every match so a prior multi-post
        # race cannot leave a stale skip notice next to a real review.
        for comment_id in $comment_ids; do
          gh api -X DELETE "repos/${REPOSITORY}/issues/comments/${comment_id}"
        done

    - name: Checkout pinned OpenHands extensions
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: OpenHands/extensions
        ref: ${{ inputs.extensions-version }}
        path: agentic-review-extensions
        persist-credentials: false

    - name: Checkout pull request repository
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
        persist-credentials: false
        path: agentic-review-repo
        submodules: recursive

    - name: Install follow-up review guidance
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      shell: bash
      env:
        REVIEW_GUIDANCE_PATH: ${{ inputs.review-guidance-path }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/install-guidance.sh" \
          agentic-review-repo \
          "$GITHUB_ACTION_PATH/skills/follow-up-review.md" \
          "$REVIEW_GUIDANCE_PATH"

    - name: Prepare persistent review memory
      id: memory
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true' && inputs.memory-enabled == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MEMORY_ISSUE_NUMBER: ${{ inputs.memory-issue-number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if ! "$GITHUB_ACTION_PATH/scripts/prepare-memory.sh" \
            agentic-review-repo \
            "$GITHUB_ACTION_PATH/skills/repository-memory.md" \
            "$REPOSITORY" \
            "$MEMORY_ISSUE_NUMBER"; then
          echo "::warning::Persistent review memory is unavailable; continuing without it"
        fi

    - name: Set up Python
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install uv
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: ${{ inputs.enable-uv-cache }}

    - name: Validate configuration
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      shell: bash
      env:
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LLM_MODEL: ${{ inputs.llm-model }}
        REVIEW_WRAP_UP_ITERATIONS: ${{ inputs.review-wrap-up-iterations }}
        MAX_REVIEW_ITERATIONS: ${{ inputs.max-review-iterations }}
        REVIEW_WRAP_UP_SECONDS: ${{ inputs.review-wrap-up-seconds }}
        SUBAGENT_WRAP_UP_ITERATIONS: ${{ inputs.subagent-wrap-up-iterations }}
        SUBAGENT_WRAP_UP_SECONDS: ${{ inputs.subagent-wrap-up-seconds }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ -z "$LLM_API_KEY" ]]; then
          echo "::error::llm-api-key is required"
          exit 1
        fi
        if [[ -z "$GITHUB_TOKEN" ]]; then
          echo "::error::github-token is required"
          exit 1
        fi
        if [[ -z "$LLM_MODEL" ]]; then
          echo "::error::llm-model is required"
          exit 1
        fi
        if [[ ! "$MAX_REVIEW_ITERATIONS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::max-review-iterations must be a positive integer"
          exit 1
        fi
        if [[ ! "$REVIEW_WRAP_UP_ITERATIONS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::review-wrap-up-iterations must be a positive integer"
          exit 1
        fi
        if [[ "$REVIEW_WRAP_UP_ITERATIONS" -ge "$MAX_REVIEW_ITERATIONS" ]]; then
          echo "::error::review-wrap-up-iterations must be less than max-review-iterations"
          exit 1
        fi
        if [[ ! "$SUBAGENT_WRAP_UP_ITERATIONS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::subagent-wrap-up-iterations must be a positive integer"
          exit 1
        fi
        if [[ "$SUBAGENT_WRAP_UP_ITERATIONS" -ge "$MAX_REVIEW_ITERATIONS" ]]; then
          echo "::error::subagent-wrap-up-iterations must be less than max-review-iterations"
          exit 1
        fi
        if [[ ! "$REVIEW_WRAP_UP_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::review-wrap-up-seconds must be a positive integer"
          exit 1
        fi
        if [[ ! "$SUBAGENT_WRAP_UP_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::subagent-wrap-up-seconds must be a positive integer"
          exit 1
        fi
        if [[ "$SUBAGENT_WRAP_UP_SECONDS" -ge "$REVIEW_WRAP_UP_SECONDS" ]]; then
          echo "::error::subagent-wrap-up-seconds must be less than review-wrap-up-seconds"
          exit 1
        fi
        if [[ -z "$PR_NUMBER" ]]; then
          echo "::error::Agentic PR Review must run from a pull_request event"
          exit 1
        fi

    - name: Verify review permission
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        # Any gh failure reaches this branch (missing scope, network, rate
        # limit, wrong PR). Soften the claim and surface gh's stderr so the
        # message is accurate when the cause is not the write scope.
        err_file="$(mktemp)"
        if ! review_id="$(
          gh api \
            -X POST \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f body='Agentic review permission check. This pending review is deleted immediately.' \
            --jq '.id' 2>"$err_file"
        )"; then
          err="$(tr '\n' ' ' <"$err_file" | sed 's/[[:space:]]\{1,\}/ /g; s/[[:space:]]*$//')"
          rm -f "$err_file"
          echo "::error::Could not create a pending review (permission preflight failed). The most common cause is a github-token without pull-requests: write — add 'permissions: { pull-requests: write }' to the review job. gh: ${err:-no details}"
          exit 1
        fi
        rm -f "$err_file"
        if [[ -z "$review_id" ]]; then
          echo "::error::Review permission check returned no review ID"
          exit 1
        fi
        if ! gh api \
          -X DELETE \
          "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${review_id}"; then
          echo "::warning::Could not delete pending permission-check review ${review_id}. This is cosmetic; delete it manually if it appears on the pull request."
        fi

    - name: Run agentic review
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true'
      shell: bash
      env:
        UV_PYTHON: '3.12'
        OPENHANDS_SDK_PACKAGE: ${{ inputs.openhands-sdk-package }}
        OPENHANDS_TOOLS_PACKAGE: ${{ inputs.openhands-tools-package }}
        LMNR_PACKAGE: ${{ inputs.lmnr-package }}
        # ACP_COMMAND and ACP_PROMPT_TIMEOUT are deliberately not set: they are
        # read only when AGENT_KIND is 'acp', and the upstream defaults already
        # match what this action would pass.
        AGENT_KIND: openhands
        LLM_MODEL: ${{ inputs.llm-model }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        REQUIRE_EVIDENCE: ${{ inputs.require-evidence }}
        USE_SUB_AGENTS: ${{ inputs.use-sub-agents }}
        REVIEW_WRAP_UP_ITERATIONS: ${{ inputs.review-wrap-up-iterations }}
        MAX_REVIEW_ITERATIONS: ${{ inputs.max-review-iterations }}
        REVIEW_WRAP_UP_SECONDS: ${{ inputs.review-wrap-up-seconds }}
        SUBAGENT_WRAP_UP_ITERATIONS: ${{ inputs.subagent-wrap-up-iterations }}
        SUBAGENT_WRAP_UP_SECONDS: ${{ inputs.subagent-wrap-up-seconds }}
        LOAD_PUBLIC_SKILLS: ${{ inputs.load-public-skills }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        REPO_NAME: ${{ github.repository }}
      run: |
        cd agentic-review-repo
        head_commit="$(git rev-parse HEAD)"
        previous_review_id="$(
          gh api --paginate --slurp \
            "repos/${REPO_NAME}/pulls/${PR_NUMBER}/reviews?per_page=100" |
            jq --arg sha "$head_commit" '
              (if length > 0 and (.[0] | type) == "array" then add else . end)
              | map(select(
                  .commit_id == $sha and
                  .user.login == "github-actions[bot]"
                ))
              | map(.id)
              | max // 0
            '
        )"
        uv run --no-project \
          --with "$OPENHANDS_SDK_PACKAGE" \
          --with "$OPENHANDS_TOOLS_PACKAGE" \
          --with "$LMNR_PACKAGE" \
          python "$GITHUB_ACTION_PATH/scripts/run-agent.py" \
            ../agentic-review-extensions/plugins/pr-review/scripts/agent_script.py

        "$GITHUB_ACTION_PATH/scripts/ensure-review-marker.sh" \
          "$REPO_NAME" \
          "$PR_NUMBER" \
          "$head_commit" \
          "$previous_review_id" \
          /tmp/review.json

    - name: Evaluate repository memory
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true' && inputs.memory-enabled == 'true' && steps.memory.outputs.issue-number != ''
      shell: bash
      env:
        UV_PYTHON: '3.12'
        OPENHANDS_SDK_PACKAGE: ${{ inputs.openhands-sdk-package }}
        LLM_MODEL: ${{ inputs.llm-model }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
        MEMORY_DECISION_PATH: ${{ runner.temp }}/agentic-review-memory-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: |
        cd agentic-review-repo
        # Composite steps cannot use continue-on-error, so absorb the failure
        # here. Memory is layered on top of a review that is already published;
        # losing it must never turn a delivered review into a red job.
        if ! uv run --no-project \
          --with "$OPENHANDS_SDK_PACKAGE" \
          python "$GITHUB_ACTION_PATH/scripts/evaluate-memory.py" \
            "$GITHUB_ACTION_PATH/skills/memory-evaluator.md" \
            "$MEMORY_DECISION_PATH"; then
          echo "::warning::Repository memory evaluation failed; the published review is unaffected"
        fi

    - name: Publish repository memory
      if: steps.skip.outputs.skip != 'true' && steps.size.outputs.oversized != 'true' && inputs.memory-enabled == 'true' && steps.memory.outputs.issue-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
        MEMORY_ISSUE_NUMBER: ${{ steps.memory.outputs.issue-number }}
        MEMORY_DECISION_PATH: ${{ runner.temp }}/agentic-review-memory-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: |
        cd agentic-review-repo
        # Same reasoning as the evaluation step: the script's own ::error::
        # annotations stay visible, but a memory write that fails must not
        # discard the review this job already delivered.
        if ! "$GITHUB_ACTION_PATH/scripts/publish-memory.sh" \
          "$MEMORY_DECISION_PATH" \
          "$REPO_NAME" \
          "$PR_NUMBER" \
          "$MEMORY_ISSUE_NUMBER" \
          "$(git rev-parse HEAD)"; then
          echo "::warning::Repository memory was not updated; the published review is unaffected"
        fi
