name: Agentic PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: agentic-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: Check out this action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review pull request
        uses: ./
        with:
          llm-api-key: ${{ secrets.MINIMAX_API_KEY }}
          github-token: ${{ github.token }}
          memory-issue-number: '1'
          use-sub-agents: 'false'
          load-public-skills: 'false'
